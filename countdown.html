<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Countdown to July 20</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;900&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --paper: #f2ede3;
    --ink: #1f2a3a;
    --red: #b6402f;
    --line: #cfc5b0;
    --gold: #c99a3d;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background: var(--paper);
    font-family:'Space Mono', monospace;
    color: var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
  }

  .board{
    position:relative;
    width: min(560px, 92vw);
    background: #fffdf9;
    border: 1px solid var(--line);
    box-shadow: 0 30px 60px -30px rgba(31,42,58,0.35);
    padding: 40px 36px 32px;
  }

  .board::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0; height:10px;
    background: repeating-linear-gradient(90deg, var(--red) 0 14px, transparent 14px 26px);
  }

  .ring{
    position:absolute; top:-14px; width:16px; height:16px;
    border-radius:50%; background: var(--paper);
    border:2px solid var(--line);
  }
  .ring.l{ left: 60px; } .ring.r{ right: 60px; }

  .eyebrow{
    font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--red); margin: 6px 0 4px; text-align:center;
  }

  .datebar{
    display:flex; align-items:baseline; justify-content:center; gap:10px;
    margin-bottom: 26px;
  }
  .datebar .month{
    font-family:'Fraunces', serif; font-weight:900; font-size: 22px;
    color: var(--ink);
  }
  .datebar .day{
    font-family:'Fraunces', serif; font-weight:900; font-size: 22px;
    color: var(--gold);
  }
  .datebar .divider{ color: var(--line); }

  .grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }

  .cell{
    text-align:center;
    padding: 18px 4px 12px;
    border: 1px solid var(--line);
    position: relative;
    background:
      linear-gradient(var(--paper), var(--paper)) padding-box;
  }

  .cell .num{
    font-family:'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(30px, 8vw, 46px);
    line-height: 1;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .cell .lab{
    margin-top: 8px;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #7a7263;
  }

  .cell::after{
    content:"";
    position:absolute; left:14px; right:14px; bottom:-7px;
    height:1px; background: var(--line);
  }

  .status{
    text-align:center;
    font-size: 13px;
    color: #55503f;
    letter-spacing: 0.02em;
  }

  .status strong{ color: var(--red); }

  .stamp{
    position:absolute;
    bottom: -16px; right: 26px;
    font-family:'Fraunces', serif;
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--gold);
    background: #fffdf9;
    padding: 4px 10px;
    border: 1px solid var(--gold);
    transform: rotate(-3deg);
  }

  @media (max-width: 420px){
    .grid{ gap: 8px; }
    .board{ padding: 30px 18px 26px; }
  }

  @media (prefers-reduced-motion: no-preference){
    .cell.tick .num{ animation: pulse 0.4s ease; }
  }
  @keyframes pulse{
    0%{ transform: scale(1); }
    30%{ transform: scale(1.08); }
    100%{ transform: scale(1); }
  }
</style>
</head>
<body>

  <div class="board">
    <div class="ring l"></div>
    <div class="ring r"></div>

    <div class="eyebrow">Counting down to</div>
    <div class="datebar">
      <span class="month">JULY</span>
      <span class="divider">/</span>
      <span class="day">20</span>
      <span class="divider">/</span>
      <span class="month">2026</span>
    </div>

    <div class="grid" id="grid">
      <div class="cell"><div class="num" id="d">00</div><div class="lab">Days</div></div>
      <div class="cell"><div class="num" id="h">00</div><div class="lab">Hours</div></div>
      <div class="cell"><div class="num" id="m">00</div><div class="lab">Minutes</div></div>
      <div class="cell"><div class="num" id="s">00</div><div class="lab">Seconds</div></div>
    </div>

    <div class="status" id="status">Every second, one page closer.</div>

    <div class="stamp">JUL 20</div>
  </div>

<script>
  const target = new Date('2026-07-20T00:00:00+08:00').getTime();
  const d = document.getElementById('d');
  const h = document.getElementById('h');
  const m = document.getElementById('m');
  const s = document.getElementById('s');
  const status = document.getElementById('status');
  const secCell = s.closest('.cell');

  function pad(n){ return String(n).padStart(2, '0'); }

  function tick(){
    const now = Date.now();
    const diff = target - now;

    if (diff <= 0){
      d.textContent = '00'; h.textContent = '00'; m.textContent = '00'; s.textContent = '00';
      status.innerHTML = '<strong>The day is here.</strong>';
      return;
    }

    const days = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor((diff / (1000*60*60)) % 24);
    const mins = Math.floor((diff / (1000*60)) % 60);
    const secs = Math.floor((diff / 1000) % 60);

    d.textContent = pad(days);
    h.textContent = pad(hours);
    m.textContent = pad(mins);
    s.textContent = pad(secs);

    secCell.classList.remove('tick');
    void secCell.offsetWidth;
    secCell.classList.add('tick');

    status.innerHTML = days + ' day' + (days === 1 ? '' : 's') + ' left, give or take a heartbeat.';
  }

  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
